          'Utilizados',
          el('span',{class:'src-origin__availability',text:`de ${avail} ${availableWord}`})
        ]),
        el('strong',{class:'src-origin__value'},[
          el('span',{class:'src-origin__used',text:used}),
          el('span',{class:'src-origin__usedword',text:usedWord})
        ])
      ]),
      el('div',{class:'src-origin__fact'},[
        el('span',{class:'src-origin__ico'},[icon('tank')]),
        el('span',{class:'src-origin__label',text:'Aqu\u00e1rio de origem'}),
        el('strong',{class:'src-origin__value',text:tank})
      ])
    ]));
  });
  return box;
}
function summaryOf(r){
  const parts=summaryParts(r);
  return [parts.primary,parts.secondary].filter(Boolean).join(' · ');
}
function fieldSelectRaw(opts, value, onChange){
  const sel = el('select',{class:'select',onchange:e=>onChange(e.target.value)},
    opts.map(o=>el('option',{value:o.v,text:o.t,selected:o.v===value?true:false})));
  sel.value=value; return sel;
}
function editRecord(r){
  // carrega no formulário [P: liberdade — pode corrigir]
  const f = blankForm(r.type);
  f.editingId = r.id;   // o original PERMANECE na lista; só é substituído ao finalizar
  f.date=r.date;
  f.responsavel=r.responsavel;
  f.obs=r.obs;
  f.fotos=(r.fotos||[]).map(photo=>({...photo}));
  f.revisar=r.status==='revisar';
  if(r.type==='reproducao'){
    f.rackPositions=rackPositionsFrom(r.data);
    if(!f.rackPositions.length) f.rackPositions=[''];
    f.rack=f.rackPositions[0]||'';
    f.machos=(r.data.machos?.length?r.data.machos:[{aquario:'',qtdAq:'',qtdUso:''}]).map(x=>({...x}));
    f.femeas=(r.data.femeas?.length?r.data.femeas:[{aquario:'',qtdAq:'',qtdUso:''}]).map(x=>({...x}));
  }
  else for(const fd of TYPES[r.type].fields) f[fd.key]=r.data[fd.key]||'';
  setCurrentDraft(f);
  if(!Store.save()){
    toast('Não foi possível preparar a edição neste computador.', {type:'error'});
    return;
  }
  App.form=f;
  toast('Registro aberto para edição. O original só muda quando você finalizar.', {type:'info'});
  go('registro');
}
// Cancela a edição sem perder o registro original [P: não perder progresso]
function cancelEdit(){
  const backup=currentDraft();
  clearCurrentDraft();
  if(!Store.save()){
    if(backup) setCurrentDraft(backup);
    toast('Não foi possível cancelar a edição neste computador.', {type:'error'});
    return;
  }
  App.form=null;
  go('registros');
  toast('Edição cancelada. O registro original foi mantido.', {type:'info'});
}
function deleteRecord(r){
  const idx=Store.data.records.findIndex(x=>x.id===r.id);
  if(idx<0) return;
  confirmModal({
    title:'Excluir registro?',
    body:'Esta ação remove o registro do histórico deste computador. Use apenas quando tiver certeza de que o lançamento não deve permanecer na base local.',
    warning:'Atenção: depois de confirmar, o registro sai da lista imediatamente. Haverá uma opção de desfazer por poucos segundos, mas não conte com isso como etapa de segurança.',
    facts:[
      ['Tipo',TYPES[r.type].label],
      ['Data',fmtDate(r.date)],
      ['Responsável',r.responsavel],
      ['Resumo',summaryOf(r)]
    ],
    requireText:'EXCLUIR',
    requireLabel:'Digite EXCLUIR para liberar a exclusão',
    requireHint:'Esta etapa evita exclusões acidentais durante a revisão do histórico.',
    confirmLabel:'Excluir registro',
    cancelLabel:'Cancelar, manter registro',
    danger:true,
    onConfirm:()=>{
      const backup=Store.data.records[idx];
      Store.data.records.splice(idx,1);
      if(!Store.save()){
        Store.data.records.splice(idx,0,backup);
        toast('O registro não foi excluído porque o armazenamento local falhou.', {type:'error',title:'Exclusão não concluída'});
        return;
      }
      App.selectedId=null;
      renderRecords();
      toast('Registro excluído.', {
        type:'info',
        action:{
          label:'Desfazer exclusão',
          fn:()=>{
            Store.data.records.splice(idx,0,backup);
            if(!Store.save()){
              Store.data.records.splice(idx,1);
              toast('Não foi possível restaurar o registro.', {type:'error'});
              return;
            }
            renderRecords();
          }
        },
        timeout:9000
      });
    }
  });
}

/* ----------------------------- timeAgo --------------------------- */
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'há instantes';
  if(s<3600) return `há ${Math.floor(s/60)} min`;
  if(s<86400) return `há ${Math.floor(s/3600)} h`;
  return `há ${Math.floor(s/86400)} dias`;
}

/* ===================================================================
   ATALHOS GLOBAIS [P: aceleradores]
   =================================================================== */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  // Ctrl/Cmd + S → salvar rascunho
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault();
    if(App.route==='registro' && App.form){ saveDraftNow(true); } return; }
  // Ctrl/Cmd + Enter → finalizar
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault();
    if(App.route==='registro') finalize(); return; }
  // Alt + 1/2/3 → trocar tipo
  if(e.altKey && ['1','2','3'].includes(e.key) && App.route==='registro'){
    e.preventDefault(); switchType(['reproducao','alimentacao','limpeza'][+e.key-1]); return; }
  if(typing) return;
  // "/" → focar busca
  if(e.key==='/' && App.route==='registros'){ e.preventDefault(); $('#searchBox')?.focus(); return; }
  // "?" → ajuda de atalhos
  if(e.key==='?'){ e.preventDefault(); showShortcuts(); return; }
  // "h" → ajuda funcional
  if(e.key.toLowerCase()==='h' && Store.data.identity){ go('ajuda'); return; }
  // "n" → novo registro
  if(e.key.toLowerCase()==='n' && Store.data.identity){ go('registro'); }
});

function showShortcuts(){
  const rows = shortcutRows();
  const bd=$('#modalBackdrop');
  if(!bd.hidden) return;
  const previousFocus=document.activeElement;
  $('#modalTitle').textContent='Atalhos de teclado';
  $('#modalBody').textContent='Acelere tarefas frequentes sem tirar as mãos do teclado.';
  const actions=$('#modalActions'); actions.innerHTML='';
  const list = el('div',{class:'shortcuts'}, rows.map(([label,keys])=>
    el('div',{class:'shortcuts__row'},[ el('span',{text:label}),
      el('span',{class:'shortcuts__keys'}, keys.map(k=>el('kbd',{text:k}))) ])));
  $('#modalBody').after(list);
  const close=()=>{
    bd.hidden=true;
    list.remove();
    $('#topbar').inert=false; $('#main').inert=false; $('#kbdHelp').inert=false;
    document.removeEventListener('keydown',onKey);
    previousFocus?.focus?.();
  };
  const done=el('button',{class:'btn',text:'Fechar atalhos',onclick:close});
  actions.append(done);
  bd.hidden=false;
  $('#topbar').inert=true; $('#main').inert=true; $('#kbdHelp').inert=true;
  done.focus();
  const onKey=e=>{if(e.key==='Escape') close();};
  document.addEventListener('keydown',onKey);
  bd.onclick=e=>{if(e.target===bd) close();};
}

/* --------------------------- Menu identidade --------------------- */
$('#userPill').addEventListener('click',e=>{
  e.stopPropagation();
  const m=$('#userMenu'); const open=m.hidden;
  m.hidden=!open;
  $('#userPill').setAttribute('aria-expanded',String(open));
  if(open) requestAnimationFrame(()=>m.querySelector('[role="menuitem"]')?.focus());
});
$('#userPill').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){
    e.preventDefault();
    $('#userMenu').hidden=false;
    $('#userPill').setAttribute('aria-expanded','true');
    $('#userMenu').querySelector('[role="menuitem"]')?.focus();
  }
});
document.addEventListener('click',e=>{
  const m=$('#userMenu');
  if(!m.hidden && !e.target.closest('#userMenu') && !e.target.closest('#userPill')){ m.hidden=true; $('#userPill').setAttribute('aria-expanded','false'); }
});
document.addEventListener('keydown',e=>{
  const m=$('#userMenu');
  if(e.key==='Escape'&&!m.hidden){
    m.hidden=true;
    $('#userPill').setAttribute('aria-expanded','false');
    $('#userPill').focus();
  }
});
$('#userMenu').addEventListener('click',e=>{
  const item=e.target.closest('[data-action]');
  if(!item) return;
  const act=item.dataset.action;
  $('#userMenu').hidden=true;
  $('#userPill').setAttribute('aria-expanded','false');
  if(act==='exportar-backup'){
    exportBackup();
    return;
  }
  if(act==='importar-backup'){
    promptImportBackup();
    return;
  }
  if(act==='trocar-identidade'){
    const proceed=()=>{
      const previous=Store.data.identity;
      if(App.form){
        App.form.savedAt=Date.now();
        setCurrentDraft(App.form);
      }
      Store.data.identity=null;
      if(!Store.save()){
        Store.data.identity=previous;
        toast('Não foi possível trocar de bolsista neste computador.', {type:'error'});
        return;
      }
      App.form=null;
      go('identificacao');
    };
    const hasDraft=!!(App.form || currentDraft());
    confirmModal({
      title:'Trocar de bolsista?',
      body:hasDraft
        ? 'Há um rascunho em andamento. Ele continuará salvo para o bolsista atual e poderá ser retomado depois.'
        : 'Você voltará para a identificação antes de lançar novos registros.',
      warning:'Registros já salvos não terão o responsável alterado. Apenas novos lançamentos usarão o próximo bolsista identificado.',
      facts:[
        ['Sessão atual',Store.data.identity?.name||'Não identificado'],
        ['Data da sessão',Store.data.identity?.date?fmtDate(Store.data.identity.date):'Não informada']
      ],
      confirmLabel:'Trocar bolsista',
      cancelLabel:'Continuar como estou',
      onConfirm:proceed
    });
  }
});
$('#kbdHelp').addEventListener('click',showShortcuts);

$('#photoViewer').addEventListener('click',e=>{ if(e.target===$('#photoViewer')) closePhotoViewer(); });
$('#photoViewer').addEventListener('close',()=>{
  $('#photoViewerImage').removeAttribute('src');
  photoViewerPreviousFocus?.focus?.();
  photoViewerPreviousFocus=null;
});

else router();
